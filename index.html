<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dvirzg</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash
      const saved = localStorage.getItem('theme')
      const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.classList.toggle('dark', dark)
      // Magic-link logins can land on the home page; forward them to the admin page
      if (location.pathname === '/' && /access_token|error_description/.test(location.hash + location.search)) {
        location.replace('/admin' + location.search + location.hash)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
